*{box-sizing:border-box}html,body{margin:0}

.wrap{max-width:1320px;margin:0 auto;padding:0 32px;width:100%}
.mbanner{display:none}

.l2{background:var(--s-low);border-radius:16px;padding:6px}
.l2row{display:flex;align-items:center;gap:4px}

<section class="e15s" aria-labelledby="e15UH"><div class="e15s-h"><span class="kicker">EPA approved uses</span><h2 id="e15UH">Where you can and can’t use E15</h2></div><div class="e15-use"><div class="e15-uc ok"><span class="tag"><span class="ms">check_circle</span>Approved</span><h3>2001 and newer light-duty vehicles</h3><ul>${li(['Cars','Light-duty trucks','SUVs and crossovers','Minivans and passenger vans','Flex-fuel vehicles of any model year'],'check')}</ul></div><div class="e15-uc no"><span class="tag"><span class="ms">block</span>Not approved</span><h3>Small engines and older vehicles</h3><ul>${li(['Vehicles built before 2001','Motorcycles','Boats and marine engines','Lawn mowers, chainsaws and other small engines','Snowmobiles, ATVs and off-road vehicles','Heavy-duty vehicles like school buses and delivery trucks'],'close')}</ul></div></div><p class="e15-fn">Look for the orange E15 label on the pump, and always follow your owner’s manual.</p></section>`}
